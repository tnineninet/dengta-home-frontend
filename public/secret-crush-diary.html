<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>暗恋日记</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --wb-orange:#ff8200;
      --wb-bg:#f2f2f2;
      --wb-card:#fff;
      --wb-text:#333;
      --wb-sub:#939393;
      --wb-border:#e8e8e8;
      --wb-soft:#f8f8f8;
      --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
    }
    html{font-family:var(--font);font-size:15px;color:var(--wb-text);background:var(--wb-bg);-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
    body{min-width:320px;min-height:100vh;padding-bottom:64px;background:var(--wb-bg)}
    button,input{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    svg{display:block}
    .page-shell{width:100%;max-width:580px;margin:0 auto;background:var(--wb-bg)}

    .wb-header{position:fixed;top:0;left:50%;z-index:100;display:flex;width:100%;max-width:580px;height:44px;transform:translateX(-50%);align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--wb-border);background:#fff}
    .wb-header .logo{color:var(--wb-orange);font-size:19px;font-weight:750;letter-spacing:-.4px}
    .header-action{display:grid;width:30px;height:30px;place-items:center;border:0;border-radius:50%;color:#888;background:#f5f5f5}
    .header-action svg{width:17px;height:17px}

    .search-panel{position:fixed;top:44px;left:50%;z-index:99;display:none;width:100%;max-width:580px;transform:translateX(-50%);padding:9px 12px;border-bottom:1px solid var(--wb-border);background:#fff}
    .search-panel.open{display:flex;gap:8px}
    .search-panel input{min-width:0;flex:1;padding:8px 11px;border:1px solid #ddd;border-radius:17px;outline:0;background:#f6f6f6;font-size:13px}
    .search-panel input:focus{border-color:#ffb36b;background:#fff}
    .search-panel button{padding:0 6px;border:0;color:#777;background:transparent;font-size:13px}
    body.search-open .profile{margin-top:96px}

    .profile{margin-top:44px;transition:margin-top .2s ease}
    .profile-cover{height:148px;background:#526b76;transition:background .24s ease}
    .profile-info{position:relative;padding:0 16px 16px;background:#fff}
    .profile-avatar{position:absolute;top:-36px;left:16px;width:72px;height:72px;border:3px solid #fff;border-radius:50%;background:#6b8e9b;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:background .24s ease}
    .profile-header{display:flex;align-items:flex-start;justify-content:space-between;padding-top:44px;gap:12px}
    .profile-main{min-width:0}
    .profile-name{font-size:20px;font-weight:700;letter-spacing:.02em}
    .profile-follow-btn{flex:0 0 auto;padding:6px 18px;border:1px solid var(--wb-orange);border-radius:17px;color:#fff;background:var(--wb-orange);font-size:13px}
    .profile-follow-btn.following{color:var(--wb-orange);background:#fff}
    .profile-bio{margin:8px 0 10px;color:var(--wb-sub);font-size:13px;line-height:1.55}
    .profile-location{display:flex;align-items:center;gap:4px;margin-bottom:13px;color:var(--wb-sub);font-size:12px}
    .profile-location svg{width:13px;height:13px}
    .profile-stats{display:flex;gap:28px}
    .stat{display:flex;flex-direction:column;align-items:center}
    .stat-num{font-size:16px;font-weight:650}
    .stat-label{margin-top:2px;color:var(--wb-sub);font-size:11px}

    .tabs{position:sticky;top:44px;z-index:90;display:flex;padding:0 12px;border-bottom:1px solid var(--wb-border);background:#fff}
    body.search-open .tabs{top:96px}
    .tab{position:relative;flex:1;padding:12px 2px;border:0;color:var(--wb-sub);background:transparent;text-align:center;font-size:14px;transition:color .2s ease}
    .tab.active{color:var(--wb-text);font-weight:650}
    .tab-line{position:absolute;bottom:0;left:50%;width:24px;height:3px;transform:translateX(-50%);border-radius:2px;background:var(--wb-orange);opacity:0;transition:opacity .2s ease}
    .tab.active .tab-line{opacity:1}

    .feed-status{padding:9px 16px;color:#aaa;background:#fafafa;font-size:11px}
    .card{margin-bottom:8px;padding:16px;background:var(--wb-card);opacity:0;transform:translateY(10px);animation:cardIn .36s ease forwards}
    @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
    .card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .card-avatar{width:42px;height:42px;flex:0 0 auto;border-radius:50%;background:#6b8e9b}
    .card-meta{min-width:0;flex:1}
    .card-name{font-size:14px;font-weight:650}
    .card-time{margin-top:2px;color:#b5b5b5;font-size:11px}
    .card-source{color:#c1c1c1}
    .card-body{font-size:15px;line-height:1.85;white-space:pre-line;word-break:break-word}
    .card-topic{margin-right:4px;color:var(--wb-orange);font-size:14px}
    .card-actions{display:flex;margin-top:14px;padding-top:10px;border-top:1px solid #f3f3f3}
    .card-action{display:flex;min-height:32px;flex:1;align-items:center;justify-content:center;gap:5px;border:0;color:#aaa;background:transparent;font-size:12px;transition:color .18s ease}
    .card-action svg{width:16px;height:16px}
    .card-action.liked{color:var(--wb-orange)}
    .card-action.liked .heart-icon{fill:currentColor}

    .card.private{padding:18px 17px 18px 19px;border-left:3px solid #dedede;background:#fafbfc}
    .private-heading{display:flex;align-items:center;gap:6px;margin-bottom:11px;color:#aaa;font-size:11px}
    .private-heading svg{width:13px;height:13px}
    .private-body{color:#555;font-size:14px;line-height:1.95;white-space:pre-line}
    .empty-result{padding:52px 24px;color:#999;background:#fff;text-align:center;line-height:1.8}
    .story-end{padding:15px 16px 25px;color:#aaa;text-align:center;font-size:11px}

    @media(min-width:600px){
      .page-shell{box-shadow:0 0 28px rgba(0,0,0,.06)}
      .card{border-radius:4px}
    }
    @media(max-width:360px){
      .profile-cover{height:132px}
      .profile-stats{gap:22px}
      .card{padding:14px}
      .card-action{gap:3px;font-size:11px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <header class="wb-header">
    <span class="logo">暗恋日记</span>
    <button class="header-action" id="searchToggle" type="button" aria-label="搜索日记" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.4-4.4"></path></svg>
    </button>
  </header>

  <div class="search-panel" id="searchPanel">
    <input id="searchInput" type="search" placeholder="搜索这一条故事线" aria-label="搜索这一条故事线">
    <button id="searchCancel" type="button">取消</button>
  </div>

  <main class="page-shell">
    <section class="profile" aria-label="日记主人资料">
      <div class="profile-cover" id="profileCover"></div>
      <div class="profile-info">
        <div class="profile-avatar" id="profileAvatar" role="img" aria-label="纯色头像"></div>
        <div class="profile-header">
          <div class="profile-main">
            <div class="profile-name" id="profileName"></div>
            <div class="profile-bio" id="profileBio"></div>
            <div class="profile-location">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
              <span id="profileLocation"></span>
            </div>
          </div>
          <button class="profile-follow-btn" id="followButton" type="button">＋ 关注</button>
        </div>
        <div class="profile-stats" id="profileStats"></div>
      </div>
    </section>

    <nav class="tabs" id="storyTabs" aria-label="暗恋故事线"></nav>
    <div class="feed-status" id="feedStatus" aria-live="polite"></div>
    <section class="feed" id="feed" aria-label="暗恋日记博文"></section>
    <div class="story-end">这些话停在这里，没有提醒任何人。</div>
  </main>

        "entries": [
          {"id":"d01","type":"public","date":"09-03 18:26","source":"iPhone","content":"开学第一天换座位。她坐我右边，把两个人中间那条缝擦得很干净，又把橡皮放在正中间。下午数学课她问我尺子有没有刻度，我说尺子当然有。后来才发现她只是忘带了。","likes":17,"comments":2,"reposts":0},
          {"id":"d02","type":"public","date":"09-17 21:08","source":"微博 weibo.com","content":"值日轮到我们。她扫地总把灰往我这边赶，说这样比较快。我把最后一排桌子摆正时，她已经在门口等我关灯。走廊只剩下广播站收设备的声音。","likes":23,"comments":1,"reposts":0},
          {"id":"d03","type":"public","date":"10-12 12:41","source":"iPhone","content":"食堂的糖醋排骨只剩一份。她端走以后回头问我是不是也想要，又从盘里夹了两块到空碗里。她说只是今天打多了。我把那只空碗端得很稳。","likes":31,"comments":4,"reposts":1},
          {"id":"d04","type":"public","date":"11-06 17:32","source":"iPhone","content":"下雨，教学楼门口挤满了人。她的伞很小，我们走到车棚时两边校服都湿了一点。她一路在说英语听写，我只记得伞骨碰过我三次。","likes":46,"comments":3,"reposts":1},
          {"id":"d05","type":"private","content":"我后来把那把伞的牌子记住了。不是为了买同一把，只是有一次在便利店看见相同的蓝色，站在那里多看了几秒。我当然知道那天她只是顺路，也知道她给别人让过座、借过笔、分过很多次零食。可我还是偷偷把那些很普通的事单独收起来，像把草稿纸里写得比较好的一行撕下来，夹进一本不会再翻的书。"},
          {"id":"d06","type":"public","date":"12-21 22:10","source":"微博 weibo.com","content":"月考成绩贴出来，她比上次多了二十七分。她拿笔敲了两下桌角，说寒假前终于不用被叫去办公室。我说挺好。其实那张排名表我中午就看过了。","likes":38,"comments":2,"reposts":0},
          {"id":"d07","type":"public","date":"02-26 16:55","source":"iPhone","content":"新学期她剪短了一点头发。班里好几个人问，她都说只是发尾太干。我没问。下午物理卷子传下来时，她用手压住刘海，窗户正好开着。","likes":52,"comments":5,"reposts":1},
          {"id":"d08","type":"public","date":"03-19 20:14","source":"微博 weibo.com","content":"晚自习停电了三分钟。大家在起哄，她从抽屉里摸出一只小手电，照着我们中间的错题本。灯亮以后，她第一件事是把那道题的辅助线补完。","likes":61,"comments":6,"reposts":2},
          {"id":"d09","type":"public","date":"04-28 18:03","source":"iPhone","content":"运动会她跑八百米。我负责终点记录，名字写得比其他人小一点，怕被看出来又重新描粗。她跑完蹲在草地上，问我成绩，我说第三。其实是第二。","likes":74,"comments":8,"reposts":2},
          {"id":"d10","type":"public","date":"05-24 23:17","source":"微博 weibo.com","content":"拍毕业照前又换了一次座位。她搬走两摞书，桌洞里剩下一张公交卡充值小票。日期是九月十七日。我问她还要不要，她看了一眼说扔了吧。","likes":83,"comments":9,"reposts":3},
          {"id":"d11","type":"public","date":"06-09 19:42","source":"iPhone","content":"最后一科结束，她把借了快一年的黑色水笔还给我，说居然还没写完。校门口人很多，我们朝不同的车站走。我本来准备了一句话，后来只说了路上小心。","likes":126,"comments":14,"reposts":5}
        ]
      },
      {
        "id": "junior",
        "tab": "学长学妹",
        "profile": {
          "name": "1026",
          "bio": "晚风经过旧操场，没有留下回声。",
          "location": "南京",
          "color": "#9a765d",

          "posts": 76,
          "following": 31,

        },
        "entries": [
          {"id":"j01","type":"public","date":"09-08 19:06","source":"iPhone","content":"社团招新，她站在桌前问报名表要不要贴照片。我说不用，名字和班级写清楚就行。她低头写字时把校牌翻了过去，所以我到晚上整理表格才知道她叫什么。","likes":21,"comments":2,"reposts":0},
          {"id":"j02","type":"public","date":"09-29 17:48","source":"微博 weibo.com","content":"第一次带新生排练。她总站错第二个八拍，结束以后一个人留在镜子前数拍子。我关音响时又放了一遍音乐，假装是自己还没练够。","likes":28,"comments":3,"reposts":1},
          {"id":"j03","type":"public","date":"10-26 20:32","source":"iPhone","content":"她来器材室还钥匙，顺便递给我一颗橘子糖，说今天发多了一颗。包装纸被她攥得有点皱。我后来把糖吃了，纸在笔袋里放到期末。","likes":43,"comments":5,"reposts":1},
          {"id":"j04","type":"public","date":"11-18 22:04","source":"微博 weibo.com","content":"广播站临时缺人，她替同学读了午间稿。最后一句把“仍然”念成了“扔然”，放学见面时还在懊恼。我说没人听出来。其实我把那段完整听完了。","likes":49,"comments":4,"reposts":2},
          {"id":"j05","type":"private","content":"我很少主动经过高一那栋楼，因为路线太明显。只有每周三交社团登记表时，我会从西边楼梯上去，再从东边下来。东边二楼能看见她们班后门。大多数时候她不在那里，我也不会停。偶尔看见她低头整理卷子，我就继续往前走，步子和平常一样。喜欢一个比自己低一级的人，好像连回头都需要一个说得过去的理由。"},
          {"id":"j06","type":"public","date":"12-30 18:19","source":"iPhone","content":"元旦汇演结束，她问我明年还会不会带他们。我说高三事情多，应该不会。她点点头，把胸前那枚临时工作牌摘下来递给我。绳结是她自己打的，很紧。","likes":57,"comments":6,"reposts":2},
          {"id":"j07","type":"public","date":"02-18 13:27","source":"微博 weibo.com","content":"开学第一周在图书馆碰见。她抱着三本练习册，问我高二物理应该先补哪一章。我在便签上写了顺序，写到最后才发现把自己的教室也写上去了，又划掉。","likes":63,"comments":5,"reposts":1},
          {"id":"j08","type":"public","date":"03-25 21:11","source":"iPhone","content":"她发来一道题，只拍到半张卷子。我看了十分钟才发现题目条件在另一面。她补拍时说不好意思学长。我回没事，然后把那两张图留在相册里很久。","likes":71,"comments":7,"reposts":2},
          {"id":"j09","type":"public","date":"04-17 18:44","source":"微博 weibo.com","content":"操场晚风很大，她和同学来给社团拍合照。我站在最后一排，快门按下前她往左挪了一步。照片里我们隔着两个人，但影子刚好挨在一起。","likes":84,"comments":9,"reposts":3},
          {"id":"j10","type":"public","date":"05-31 23:02","source":"iPhone","content":"离校手续办完，她发消息问我毕业册能不能留一页。我写了很普通的四句话，最后一行空着。合上以前，我在空白处写了：其实每次经过你们班都不是顺路。","likes":109,"comments":12,"reposts":4},
          {"id":"j11","type":"public","date":"06-12 20:36","source":"微博 weibo.com","content":"她晚上回复了一张毕业册照片，圈出最后那行，下面写：我知道，东边楼梯并不通你们教室。我们约好暑假去还那本物理笔记。第一次觉得六月也可以不是结束。","likes":188,"comments":23,"reposts":8}
        ]
      },
      {
        "id": "nextclass",
        "tab": "隔壁班",
        "profile": {
          "name": "0314",
          "bio": "走廊尽头总有一扇窗开着。",

        "entries": [
          {"id":"n01","type":"public","date":"09-11 10:23","source":"iPhone","content":"大课间去办公室抱作业，在隔壁班门口和她撞了一下。她手里的英语卷掉了几张，捡起来以后按页码重新排好，还跟我说了两次谢谢。","likes":14,"comments":1,"reposts":0},
          {"id":"n02","type":"public","date":"10-04 16:08","source":"微博 weibo.com","content":"国庆自习，整层楼只开了三个教室。饮水机没水，她拿着杯子问我另一层有没有。我陪她下去，回来时两个人都忘了刚才做到第几题。","likes":25,"comments":2,"reposts":0},
          {"id":"n03","type":"public","date":"10-31 18:52","source":"iPhone","content":"走廊展板换成秋季主题。她负责贴照片，最右边总是歪。我从教室出来时帮她扶了一下胶带，她退后看了很久，说这样差不多。那张照片后来一直没掉。","likes":33,"comments":3,"reposts":1},
          {"id":"n04","type":"public","date":"11-27 12:16","source":"微博 weibo.com","content":"午休广播太响，她们班后门关不上。她用一本旧字典抵着门，风一吹还是会动。我把实验室不用的门吸拿过来，她问我从哪找的，我说碰巧。","likes":41,"comments":4,"reposts":1},
          {"id":"n05","type":"public","date":"12-19 20:47","source":"iPhone","content":"年级交换礼物，我抽到一盒彩色回形针。放学路过隔壁班，看见她用普通订书钉夹竞赛资料。我分了一半给她，只说这种不容易划破纸。","likes":50,"comments":5,"reposts":2},
          {"id":"n06","type":"private","content":"其实我知道她每天什么时候去接水，也知道她周五最后一节课会留下来擦黑板。这些时间不是我故意记的，只是相同的事情重复得多了，身体会先于脑子做出安排。我会在第四节课下课才去洗杯子，会把原本周四交的表留到周五。我们说过的话加起来可能不到十分钟，可我已经在这些短短的路程里排练过很多次更长的对话。一次都没有真的开始。"},
          {"id":"n07","type":"public","date":"02-23 17:04","source":"微博 weibo.com","content":"返校搬书，她一个人抱不完。我把最上面那摞拿到她座位，封面写着名字和新学期计划。第一条是早睡。我没有往下看。","likes":59,"comments":6,"reposts":2},
          {"id":"n08","type":"public","date":"03-14 21:30","source":"iPhone","content":"生日没有告诉别人。晚自习结束，她在楼梯口递给我一盒牛奶，说自动售货机多掉了一盒。生产日期刚好是今天。我知道那只是巧合，还是拍了张照片。","likes":77,"comments":8,"reposts":3},
          {"id":"n09","type":"public","date":"04-09 19:18","source":"微博 weibo.com","content":"模拟考换考场，她坐我原来的位置。考试结束后桌上留了一张草稿纸，角落画着一扇很小的窗。我把纸交到讲台，没有带走。","likes":82,"comments":7,"reposts":2},
          {"id":"n10","type":"public","date":"05-16 16:39","source":"iPhone","content":"听说她家六月要搬去别的城市。下午走廊还是和平常一样，她在门口背单词。我从旁边经过，只问了一句消息是真的吗。她说嗯，已经定了。","likes":96,"comments":10,"reposts":3},
          {"id":"n11","type":"public","date":"06-06 18:57","source":"微博 weibo.com","content":"她们班今天清空教室。走廊尽头那扇窗关上了，门吸还留在墙边。她走以前把那盒彩色回形针放回我桌上，只少了一枚绿色的。我没有问她为什么留下那一枚。","likes":137,"comments":15,"reposts":5}
        ]
      }
    ]
  }
  </script>

  <script>
    (() => {
      "use strict";

      const data = JSON.parse(document.getElementById("diary-data").textContent);
      const state = {
        storyIndex: 0,
        query: "",
        likes: readStorage("crush-diary-likes-v1", {}),
        following: readStorage("crush-diary-following-v1", {})
      };

      const elements = {
        cover: document.getElementById("profileCover"),
        avatar: document.getElementById("profileAvatar"),
        name: document.getElementById("profileName"),
        bio: document.getElementById("profileBio"),
        location: document.getElementById("profileLocation"),
        stats: document.getElementById("profileStats"),
        follow: document.getElementById("followButton"),
        tabs: document.getElementById("storyTabs"),
        feed: document.getElementById("feed"),
        feedStatus: document.getElementById("feedStatus"),
        searchToggle: document.getElementById("searchToggle"),
        searchPanel: document.getElementById("searchPanel"),
        searchInput: document.getElementById("searchInput"),
        searchCancel: document.getElementById("searchCancel")
      };

      const icons = {
        repost: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 7h10l-2.6-2.6M17 7l-2.6 2.6"></path><path d="M17 17H7l2.6 2.6M7 17l2.6-2.6"></path></svg>',
        comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5.5h16v11H9l-5 3v-14Z"></path></svg>',
        heart: '<svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.8 5.8a5 5 0 0 0-7.1 0L12 7.5l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21l8.8-8.1a5 5 0 0 0 0-7.1Z"></path></svg>',
        lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>'
      };

      function readStorage(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (_) {
          return fallback;
        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (_) {
          // 隐私模式或存储不可用时，当前页面内的交互仍然有效。
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function currentStory() {
        return data.stories[state.storyIndex];
      }

      function renderTabs() {
        elements.tabs.innerHTML = data.stories.map((story, index) => (
          '<button class="tab' + (index === state.storyIndex ? ' active' : '') + '" type="button" role="tab" aria-selected="' + (index === state.storyIndex) + '" data-story-index="' + index + '">' +
            escapeHtml(story.tab) + '<span class="tab-line"></span>' +
          '</button>'
        )).join("");
      }

      function renderProfile() {
        const story = currentStory();
        const profile = story.profile;
        elements.cover.style.background = profile.cover;
        elements.avatar.style.background = profile.color;
        elements.avatar.setAttribute("aria-label", profile.name + " 的纯色头像");
        elements.name.textContent = profile.name;
        elements.bio.textContent = profile.bio;
        elements.location.textContent = profile.location;
        elements.stats.innerHTML = [
          [profile.posts, "微博"],
          [profile.following, "关注"],
          [profile.followers, "粉丝"]
        ].map(item => '<div class="stat"><span class="stat-num">' + item[0] + '</span><span class="stat-label">' + item[1] + '</span></div>').join("");
        const isFollowing = state.following[story.id] === true;
        elements.follow.classList.toggle("following", isFollowing);
        elements.follow.textContent = isFollowing ? "已关注" : "＋ 关注";
        elements.follow.setAttribute("aria-pressed", String(isFollowing));
      }

      function matchesQuery(entry) {
        if (!state.query) return true;
        return entry.content.toLocaleLowerCase("zh-CN").includes(state.query);
      }

      function publicCard(story, entry, index) {
        const key = story.id + ":" + entry.id;
        const liked = state.likes[key] === true;
        const likeCount = entry.likes + (liked ? 1 : 0);
        return '<article class="card" style="animation-delay:' + Math.min(index * 38, 260) + 'ms">' +
          '<header class="card-header">' +
            '<div class="card-avatar" style="background:' + story.profile.color + '" role="img" aria-label="纯色头像"></div>' +
            '<div class="card-meta"><div class="card-name">' + escapeHtml(story.profile.name) + '</div>' +
            '<div class="card-time">' + escapeHtml(entry.date) + ' <span class="card-source">来自 ' + escapeHtml(entry.source) + '</span></div></div>' +
          '</header>' +
          '<div class="card-body"><span class="card-topic">#暗恋日记#</span>' + escapeHtml(entry.content) + '</div>' +
          '<div class="card-actions">' +
            '<button class="card-action" type="button" aria-label="转发 ' + entry.reposts + ' 次">' + icons.repost + '<span>' + entry.reposts + '</span></button>' +
            '<button class="card-action" type="button" aria-label="评论 ' + entry.comments + ' 条">' + icons.comment + '<span>' + entry.comments + '</span></button>' +
            '<button class="card-action like-button' + (liked ? ' liked' : '') + '" type="button" data-like-key="' + key + '" aria-pressed="' + liked + '" aria-label="' + (liked ? '取消点赞' : '点赞') + '">' + icons.heart + '<span>' + likeCount + '</span></button>' +
          '</div>' +
        '</article>';
      }

      function privateCard(entry, index) {
        return '<article class="card private" style="animation-delay:' + Math.min(index * 38, 260) + 'ms">' +
          '<div class="private-heading">' + icons.lock + '<span>仅自己可见</span></div>' +
          '<div class="private-body">' + escapeHtml(entry.content) + '</div>' +
        '</article>';
      }

      function renderFeed() {
        const story = currentStory();
        const visibleEntries = story.entries.filter(matchesQuery);
        const publicCount = story.entries.filter(entry => entry.type === "public").length;
        const privateCount = story.entries.length - publicCount;
        elements.feedStatus.textContent = state.query
          ? "找到 " + visibleEntries.length + " 条包含“" + state.query + "”的日记"
          : publicCount + " 条公开博文 · " + privateCount + " 条仅自己可见";

        if (visibleEntries.length === 0) {
          elements.feed.innerHTML = '<div class="empty-result">没有找到对应的日记。<br>换一个更短的词试试。</div>';
          return;
        }

        elements.feed.innerHTML = visibleEntries.map((entry, index) => (
          entry.type === "private" ? privateCard(entry, index) : publicCard(story, entry, index)
        )).join("");
      }

      function renderAll() {
        renderTabs();
        renderProfile();
        renderFeed();
      }

      function closeSearch() {
        state.query = "";
        elements.searchInput.value = "";
        elements.searchPanel.classList.remove("open");
        document.body.classList.remove("search-open");
        elements.searchToggle.setAttribute("aria-expanded", "false");
        renderFeed();
      }

      elements.tabs.addEventListener("click", event => {
        const button = event.target.closest("[data-story-index]");
        if (!button) return;
        const nextIndex = Number(button.dataset.storyIndex);
        if (!Number.isInteger(nextIndex) || !data.stories[nextIndex]) return;
        state.storyIndex = nextIndex;
        state.query = "";
        elements.searchInput.value = "";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      elements.feed.addEventListener("click", event => {
        const likeButton = event.target.closest(".like-button");
        if (!likeButton) return;
        const key = likeButton.dataset.likeKey;
        state.likes[key] = state.likes[key] !== true;
        writeStorage("crush-diary-likes-v1", state.likes);
        renderFeed();
      });

      elements.follow.addEventListener("click", () => {
        const story = currentStory();
        state.following[story.id] = state.following[story.id] !== true;
        writeStorage("crush-diary-following-v1", state.following);
        renderProfile();
      });

      elements.searchToggle.addEventListener("click", () => {
        const shouldOpen = !elements.searchPanel.classList.contains("open");
        elements.searchPanel.classList.toggle("open", shouldOpen);
        document.body.classList.toggle("search-open", shouldOpen);
        elements.searchToggle.setAttribute("aria-expanded", String(shouldOpen));
        if (shouldOpen) elements.searchInput.focus();
      });

      elements.searchCancel.addEventListener("click", closeSearch);
      elements.searchInput.addEventListener("input", event => {
        state.query = event.target.value.trim().toLocaleLowerCase("zh-CN");
        renderFeed();
      });

      renderAll();
    })();
  </script>
</body>
</html>
