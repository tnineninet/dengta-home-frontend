name: Vercel storage cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Keep only the newest ten Vercel deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_P6wMEPflv6ZGrwz9Aef92RWSCAqP
          VERCEL_TEAM_ID: team_yr64LG4a6KOkuZ6WFpHqb7KA
          APPLY: "1"
          KEEP: "10"
        run: node scripts/vercel-cleanup.mjs
