name: Verify production deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: verify-production-deployment
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel Production deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            latest="$(gh api "repos/${REPO}/deployments?environment=Production&per_page=1" --jq '.[0].sha // ""')"
            state=""
            if [ -n "$latest" ]; then
              state="$(gh api "repos/${REPO}/deployments?environment=Production&per_page=1" --jq '.[0].id' | xargs -r -I{} gh api "repos/${REPO}/deployments/{}/statuses" --jq '.[0].state // ""')"
            fi
            echo "attempt=${attempt} latest=${latest} state=${state} expected=${EXPECTED_SHA}"
            if [ "$latest" = "$EXPECTED_SHA" ] && [ "$state" = "success" ]; then
              echo "Production deployment succeeded."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the Production deployment of ${EXPECTED_SHA}." >&2
          exit 1
