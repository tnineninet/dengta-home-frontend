name: Verify APK integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/updates/android.json"
      - "scripts/verify-apk-integrity.mjs"
      - ".github/workflows/verify-apk-integrity.yml"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-apk-integrity
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download APK and compare SHA256 with feed
        run: node scripts/verify-apk-integrity.mjs
